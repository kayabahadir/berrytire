<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berry Coffee – Menü</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}</style></head>
<body><video id="v" src="video.mp4" autoplay muted loop playsinline preload="auto"></video>
<script>
var v=document.getElementById("v");
function p(){var r=v.play();if(r&&r.catch)r.catch(function(){})}
// Sadece gerçek hata olursa yenile (videoyu başa saran kod YOK)
v.addEventListener("error",function(){setTimeout(function(){location.reload()},10000)});
// Bekçi: video 15 sn boyunca hiç ilerlemediyse sadece devam ettir
var last=-1,still=0;
setInterval(function(){
  if(v.currentTime===last){still++;if(still>=3){p();still=0}}else{still=0;last=v.currentTime}
},5000);
addEventListener("click",p);
addEventListener("keydown",function(e){if(e.key==="f")document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()});
p();
// Saatte bir yenile (yeni video yüklendiyse otomatik gelir)
setTimeout(function(){location.reload()},3600000);
</script></body></html>
